{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body, html{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial, sans-serif;
  background: url("{% static 'images/bg.jpg' %}") no-repeat center center;
  background-size: cover;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CARD */
.card{  
  width:350px;  
  min-height:400px;  
background: rgba(245,245,220,0.85); 
  border-radius:15px;  
  padding:25px;  
  box-shadow:0 8px 20px rgba(0,0,0,0.3);  
  display:flex;  
  flex-direction:column;  
  position:relative;  
  transition: background 0.3s;  
}  
  
.card.dark{  
  background: rgba(50,50,50,0.9);  
  color:rgb(182, 179, 179);  
}  

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.language{
  position:relative;
  cursor:pointer;
  font-weight:bold;
}

.language ul{
  display:none;
  position:absolute;
  top:25px;
  left:0;
  background:white;
  list-style:none;
  padding:5px;
  border-radius:5px;
}

.language ul li{
  padding:5px;
  cursor:pointer;
}

.language ul li:hover{
  background:#eee;
}

/* DARK MODE */
.switch{
  position:relative;
  width:50px;
  height:24px;
}

.switch input{display:none;}

.slider{
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  background:#ccc;
  border-radius:34px;
}

.slider:before{
  content:"";
  position:absolute;
  height:18px;
  width:18px;
  left:3px;
  bottom:3px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}

input:checked + .slider{
  background:#8B5E3C;
}

input:checked + .slider:before{
  transform: translateX(26px);
}

/* HEADER */
.header{
  text-align:center;
  font-size:28px;
  margin-bottom:20px;
  color:#8B5E3C;
}

/* FORM */
.form-group{
  margin-bottom:15px;
  display:flex;
  flex-direction:column;
}

input{
  padding:12px;
  border-radius:25px;
  border:none;
  outline:none;
}

/* PASSWORD */
.password-box{
  position:relative;
  width:100% ;
}

.password-box input{
  width:100%;
  padding-right:45px;
  box-sizing: border-box;
}

html[dir="ltr"] .password-box i{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

html[dir="rtl"] .password-box i{
  position:absolute;
  left:12px;
  right: auto;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* BUTTON */
.login-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  background:#8B5E3C;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* HELP */
.help{
  text-align:center;
  margin-top:10px;
}

.help a{
  color:#1877f2;
  text-decoration:none;
}

/* SOCIAL */
.social{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:15px;
}

.social i{
  font-size:25px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="card" id="card">

<div class="top-bar">

<div class="language" id="currentLang">
English ▼
<ul id="langOptions">
<li data-lang="English">English</li>
<li data-lang="Français">Français</li>
<li data-lang="العربية">العربية</li>
</ul>
</div>
  <div class="dark-mode-wrapper" style="display:flex; align-items:center; gap:8px;">  
  <span>Dark Mode</span>  
  <label class="switch">  
    <input type="checkbox" id="modeToggle">  
    <span class="slider"></span>  
  </label>  
 </div>  
  </div> 

<div class="header" id="titleText">Log in</div>

<div class="form-group">
<label id="userLabel">Phone number, email or username</label>
<input type="text">
</div>

<div class="form-group password-box">
<label id="passLabel">Password</label>
<input type="text" id="password">
<i class="fa-solid fa-eye-slash" id="togglePassword"></i>
</div>

<button class="login-btn" id="loginText">Log in</button>

<p class="help">
<span id="helpText">Don't have an account?</span>
<a href="/signup/" id="helpLink">Sign up</a>
</p>




</div>

<script>
// PASSWORD (عكسنا المنطق كما طلبت)
const pass = document.getElementById("password");
const eye = document.getElementById("togglePassword");
eye.onclick = () => {
  if(pass.type === "text"){
    pass.type = "password";
    eye.classList.remove("fa-eye");
    eye.classList.add("fa-eye-slash");
  }else{
    pass.type = "text";
    eye.classList.remove("fa-eye-slash");
    eye.classList.add("fa-eye");
  }
};

// DARK MODE
document.getElementById("modeToggle").onchange = function(){
  document.getElementById("card").classList.toggle("dark");
};

// LANGUAGES
const translations = {
English:{
  title:"Log in",
  userLabel:"Phone number, email or username",
  passLabel:"Password",
  loginText:"Log in",
  helpText:"Don't have an account?",
  helpLink:"Sign up"
},
Français:{
  title:"Se connecter",
  userLabel:"Numéro, email ou nom d'utilisateur",
  passLabel:"Mot de passe",
  loginText:"Se connecter",
  helpText:"Pas de compte ?",
  helpLink:"S'inscrire"
},
العربية:{
  title:"تسجيل الدخول",
  userLabel:"رقم الهاتف أو البريد أو اسم المستخدم",
  passLabel:"كلمة المرور",
  loginText:"تسجيل الدخول",
  helpText:"ليس لديك حساب؟",
  helpLink:"إنشاء حساب"
}
};

const current = document.getElementById("currentLang");
const options = document.getElementById("langOptions");

current.onclick = () => {
  options.style.display = options.style.display === "block" ? "none" : "block";
};

options.querySelectorAll("li").forEach(li=>{
  li.onclick = ()=>{
    const lang = li.dataset.lang;

    current.childNodes[0].textContent = lang;

    document.getElementById("titleText").textContent = translations[lang].title;
    document.getElementById("userLabel").textContent = translations[lang].userLabel;
    document.getElementById("passLabel").textContent = translations[lang].passLabel;
    document.getElementById("loginText").textContent = translations[lang].loginText;
    document.getElementById("helpText").textContent = translations[lang].helpText;
    document.getElementById("helpLink").textContent = translations[lang].helpLink;

    document.documentElement.dir = lang === "العربية" ? "rtl" : "ltr";

    options.style.display = "none";
  };
});
</script>

</body>
</html>
