{% load static %}

<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>BookStore Login</title>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <style>  
body{  
  margin:0;  
  padding:0;  
  height:100vh;  
  background:url("{% static 'images/bg.jpg' %}") center/cover no-repeat;  
  
  display:flex;  
  justify-content:center;  
  align-items:center;  
}  
  
/* البطاقة */  
.card{  
  width:350px;  
  min-height:400px;  
background: rgba(245,245,220,0.85); 
  border-radius:15px;  
  padding:25px;  
  box-shadow:0 8px 20px rgba(0,0,0,0.3);  
  display:flex;  
  flex-direction:column;  
  position:relative;  
  transition: background 0.3s;  
}  
  
.card.dark{  
  background: rgba(50,50,50,0.9);  
  color:rgb(182, 179, 179);  
}  
  
  
  
/* Top bar: Language & Dark Mode */  
.top-bar{  
  display:flex;  
  justify-content:space-between;  
  align-items:center;  
  margin-bottom:15px;  
}  
.language{  
  position:relative;  
  cursor:pointer;  
  font-weight:bold;  
}  
.language ul{  
  display:none;  
  position:absolute;  
  top:25px;  
  left:50%;  
  transform:translateX(-50%);  
  background:rgba(255,255,255,0.95);  
  list-style:none;  
  padding:5px 0;  
  border-radius:5px;  
  min-width:100px;  
}  
.language ul li{  
  padding:5px 10px;  
  cursor:pointer;  
}  
.language ul li:hover{  
  background:#f0e6d0;  
}  
  
/* Dark mode switch */  
.switch {  
  position: relative;  
  display: inline-block;  
  width: 50px;  
  height: 24px;  
  cursor:pointer;  
}  
.switch input { display:none; }  
.slider {  
  position: absolute;  
  top:0;  
  left:0;  
  right:0;  
  bottom:0;  
  background:#ccc;  
  border-radius:34px;  
  transition:0.4s;  
}  
.slider:before {  
  position: absolute;  
  content:"";  
  height:18px;  
  width:18px;  
  left:3px;  
  bottom:3px;  
  background:white;  
  transition:0.4s;  
  border-radius:50%;  
}  
input:checked + .slider {  
  background:#8B5E3C;  
}  
input:checked + .slider:before {  
  transform: translateX(26px);  
}  
  
/* Bookstore header */  
.header{  
  display:flex;  
  flex-direction:column;  
  align-items:center;  
  font-family:'Pacifico', cursive;  
  font-size:28px;  
  color:#8B5E3C;  
  margin-bottom:20px;  
}  
.header i{  
  font-size:28px;  
  margin-bottom:5px;  
}  
  
/* Form */  
.form-group{  
  display:flex;  
  flex-direction:column;  
  margin-bottom:15px;  
}  
.form-group label{  
  margin-bottom:5px;  
}  
input{  
  padding:12px;  
  border-radius:25px;  
  border:none;  
  outline:none;  
  width:100%;  
  box-sizing:border-box; /* مهم لمنع خروج الإطار */  
}  
  
/* Password box */  
.password-box{  
    position:relative;  
    display:block; /* 👈 بدل flex */  
}  
.password-box i{  
    position:absolute;  
    top:50%;  
    transform:translateY(-50%);  
    cursor:pointer;  
}  
.password-box input{  
    width: 100%;  
    padding-right: 45px; /* 👈 مساحة للعين */  
    padding-left: 10px;  
    box-sizing: border-box;  
}  
/* LTR (English / French) */  
html[dir="ltr"] .password-box i{  
    right:12px;  
}  
  
/* RTL (Arabic) */  
html[dir="rtl"] .password-box i{  
    left:12px;  
}  
  
/* Login button */  
.login-btn{  
  padding:12px;  
  border:none;  
  border-radius:25px;  
  background:#8B5E3C;  
  color:white;  
  font-weight:bold;  
  cursor:pointer;  
  margin-top:10px;  
}  
  
/* Help text */  
.help{  
  margin-top:10px;  
  text-align:center;  
}  
.help a{  
  color:#1877f2;  
  font-weight:bold;  
  text-decoration:none;  
  cursor:pointer;  
}  
.help a:hover{  
  text-decoration:underline;  
}  
  
/* OR text */  

  
/* Social logos */  
.social{  
  display:flex;  
  justify-content:center;  
  gap:25px;  
  margin-top:10px;  
}  
.social-icon{  
  font-size:28px;  
  cursor:pointer;  
  transition:0.3s;  
}  
.social-icon:hover{  
  transform:scale(1.2);  
}  
.google{color:#DB4437;}  
.facebook{color:#1877f2;}  
.twitter{color:#1DA1F2;}  

  


</style> 
 </head>  
<body> 
     <div class="card" id="loginCard"><!-- Top bar -->

  <div class="top-bar">  
    <div class="language" id="currentLang">  
      English <i class="fa-solid fa-chevron-down"></i>  
      <ul id="langOptions">  
        <li data-lang="English">English</li>  
        <li data-lang="Français">Français</li>  
        <li data-lang="العربية">العربية</li>  
      </ul>  
    </div>  
    <div class="dark-mode-wrapper" style="display:flex; align-items:center; gap:8px;">  
  <span>Dark Mode</span>  
  <label class="switch">  
    <input type="checkbox" id="modeToggle">  
    <span class="slider"></span>  
  </label>  
 </div>  
  </div>  
    <!-- Bookstore header -->
         <div class="header"id="titleText">  
    Sign Up  
  </div>    <!-- Form fields -->    <div class="form-group">  
    <label id="userLabel">Phone number, email or username</label>  
    <input type="text" id="username" placeholder="">  
  </div>    <div class="form-group password-box">  
    <label id="passLabel">Password</label>  
    <input type="text" id="password" placeholder="">  
    <i class="fa-solid fa-eye" id="togglePassword"></i>  
  </div>  <button class="login-btn" id="loginText">Sign Up</button>

 <p class="help">    
  <span id="haveAccountText">Already have an account?</span>    
  <a href="/login" id="loginLink">Log in</a>    
</p>   
   <!-- Social logos -->     
 
  


<script>  
// Password toggle  const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.onclick = function(){
const isText = password.getAttribute("type") === "text";

password.setAttribute("type", isText ? "password" : "text");

this.classList.toggle("fa-eye-slash"); // يظهر الخط
this.classList.toggle("fa-eye");
};

// Dark mode toggle
const modeToggle = document.getElementById("modeToggle");
const card = document.getElementById("loginCard");
modeToggle.onchange = () => {
card.classList.toggle("dark");
};

// Language change
const current = document.getElementById("currentLang");
const options = document.getElementById("langOptions");

const translations = {
English: {
title:"Sign Up",
userLabel:"Phone number, email or username",
passLabel:"Password",
loginText:"Sign Up",
haveAccountText:"Already have an account?",
loginLink:"Log in",
orText:"OR"
},
Français:{
title:"Inscription",
userLabel:"Numéro, email ou nom d'utilisateur",
passLabel:"Mot de passe",
loginText:"S'inscrire",
haveAccountText:"Vous avez déjà un compte ?",
loginLink:"Se connecter",
orText:"OU"
},
العربية:{
title:"إنشاء حساب",
userLabel:"رقم الهاتف أو البريد أو اسم المستخدم",
passLabel:"كلمة المرور",
loginText:"تسجيل",
haveAccountText:"هل لديك حساب؟",
loginLink:"تسجيل الدخول",
orText:"أو"
}
};
current.onclick = () => {
options.style.display = options.style.display === "block" ? "none" : "block";
};options.querySelectorAll("li").forEach(li => {
li.onclick = () => {
const lang = li.dataset.lang;
current.childNodes[0].textContent = lang;
document.getElementById("titleText").textContent = translations[lang].title;
document.getElementById("userLabel").textContent = translations[lang].userLabel;
document.getElementById("passLabel").textContent = translations[lang].passLabel;
document.getElementById("loginText").textContent = translations[lang].loginText;
document.getElementById("haveAccountText").textContent = translations[lang].haveAccountText;
document.getElementById("loginLink").textContent = translations[lang].loginLink;


if(lang === "العربية"){  
  document.documentElement.dir = "rtl";  
} else {  
  document.documentElement.dir = "ltr";  
}  

options.style.display = "none";

};
});
</script>

</body>  
</html>
