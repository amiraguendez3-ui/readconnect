{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | BookNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f5f0;
            color: #1a1a2e;
        }
        :root {
            --deep: #561d46;
            --mid: #ae6a97;
            --light: #eca8bb;
            --cream: #ffffff;
        }
        .main-content {
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }
        .form-card {
            background: white;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(86,29,70,0.08);
            border: 1px solid rgba(236,168,187,0.3);
        }
        .form-card h2 {
            color: var(--deep);
            margin-bottom: 20px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--deep);
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 30px;
            border: 1px solid #e0d6dc;
            outline: none;
            font-family: inherit;
        }
        input:focus {
            border-color: var(--mid);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--deep), var(--mid));
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(86,29,70,0.3);
        }
        .error-message {
            background: #fde8f0;
            color: #e74c3c;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            border-left: 3px solid #e74c3c;
        }
        .success-message {
            background: #dcfce7;
            color: #27ae60;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            border-left: 3px solid #27ae60;
        }
    </style>
</head>
<body>

{% include 'header.html' %}

<div class="main-content">
    <div class="form-card">
        <h2>🔐 Change Password</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}error-message{% else %}success-message{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="/profile/change-password/">
            {% csrf_token %}
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="old_password" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password1" required>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="new_password2" required>
            </div>
            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>
</div>

</body>
</html>
